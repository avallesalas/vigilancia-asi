<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novedades del mapa: quién vigila a la superinteligencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/asi.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="asi-body">

  <nav class="asi-toc" id="toc">
    <a class="back" href="index.html">← Volver al mapa</a>
    <p class="asi-toc-title">Versiones</p>
    <ol id="toc-list"></ol>
  </nav>

  <a class="back-mobile" href="index.html">← Volver al mapa</a>
  <details class="asi-toc-mobile">
    <summary>Versiones</summary>
    <ol id="toc-list-mobile"></ol>
  </details>

  <main class="asi-content">
    <h1>Novedades del mapa</h1>
    <p class="sub">qué ha cambiado en el mapa en cada versión</p>
    <div class="page-nav">
      <a href="index.html">← Mapa</a>
      <a href="asi.html">Qué es la ASI</a>
      <a href="noticias.html">Noticias</a>
    </div>
    <p class="rel-stats" id="stats"></p>
    <div id="releases"><p class="page-status">Cargando novedades…</p></div>
    <div class="asi-back-footer"><a href="index.html">← Volver al mapa</a></div>
  </main>
</div>

<script>
(function () {
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const MONTHS_SHORT = ['ene.','feb.','mar.','abr.','may.','jun.','jul.','ago.','sept.','oct.','nov.','dic.'];
  const KINDS = {
    new:      { label: 'Nuevo en el mapa',        cls: 'k-new' },
    updated:  { label: 'Actualizado y corregido', cls: 'k-updated' },
    improved: { label: 'Mejoras',                 cls: 'k-improved' }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const longDate = d => { const [y, m, day] = d.split('-'); return `${parseInt(day, 10)} de ${MONTHS[parseInt(m, 10) - 1]} de ${y}`; };
  const shortDate = d => { const [y, m, day] = d.split('-'); return `${parseInt(day, 10)} ${MONTHS_SHORT[parseInt(m, 10) - 1]} ${y}`; };

  function render(rel, data) {
    const names = {};
    for (const n of data.nodes || []) names[n.id] = n.name;
    if ((data.nodes || []).length) {
      document.getElementById('stats').textContent =
        `Hoy el mapa reúne ${data.nodes.length} organizaciones y documentos, y ${(data.edges || []).length} relaciones entre ellos.`;
    }

    const releases = rel.releases || [];
    const chip = id => {
      if (!names[id]) { console.warn('[novedades] id de nodo inexistente en data.json:', id); return ''; }
      return `<a class="node-ref" href="index.html?node=${encodeURIComponent(id)}" title="Ver ${esc(names[id])} en el mapa">↗ ${esc(names[id])}</a>`;
    };

    let html = '';
    releases.forEach((r, i) => {
      const id = `v-${r.date}${releases.filter(x => x.date === r.date).length > 1 ? '-' + i : ''}`;
      r._id = id;
      html += `<section class="rel" id="${id}">
        <p class="rel-date">${esc(longDate(r.date))}${i === 0 ? ' <span class="rel-latest">última versión</span>' : ''}</p>
        <h2>${esc(r.title)}</h2>
        ${r.summary ? `<p class="rel-summary">${esc(r.summary)}</p>` : ''}`;
      for (const s of r.sections || []) {
        const k = KINDS[s.kind] || { label: s.kind, cls: '' };
        html += `<h3 class="rel-kind ${k.cls}">${esc(k.label)}</h3><ul class="rel-list">`;
        for (const it of s.items || []) {
          const chips = (it.nodes || []).map(chip).join('');
          html += `<li>${esc(it.text)}${chips ? `<div class="news-nodes">${chips}</div>` : ''}</li>`;
        }
        html += '</ul>';
      }
      html += '</section>';
    });
    document.getElementById('releases').innerHTML = html || '<p class="page-status">Todavía no hay novedades.</p>';

    const toc = releases.map((r, i) =>
      `<li class="${i === 0 ? 'active' : ''}"><a href="#${r._id}"><span class="toc-date">${esc(shortDate(r.date))}</span>${esc(r.title)}</a></li>`).join('');
    document.getElementById('toc-list').innerHTML = toc;
    document.getElementById('toc-list-mobile').innerHTML = toc;

    // Resalta en el índice la versión visible.
    const lis = [...document.querySelectorAll('#toc-list li')];
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const idx = releases.findIndex(r => r._id === e.target.id);
        lis.forEach((li, j) => li.classList.toggle('active', j === idx));
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    document.querySelectorAll('.rel').forEach(s => obs.observe(s));

    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  }

  Promise.all([
    fetch('releases.json').then(r => r.json()),
    fetch('data.json').then(r => r.json()).catch(() => ({ nodes: [], edges: [] }))
  ]).then(([rel, data]) => render(rel, data)).catch(err => {
    console.error(err);
    document.getElementById('releases').innerHTML =
      '<p class="page-status">No se pudieron cargar las novedades (releases.json). Si abres el fichero en local, sírvelo con un servidor HTTP.</p>';
  });
})();
</script>
</body>
</html>
