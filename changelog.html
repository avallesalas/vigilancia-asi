<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambios en el mapa: quién vigila a la superinteligencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/asi.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="asi-body">

  <nav class="asi-toc" id="toc">
    <a class="back" href="index.html">← Volver al mapa</a>
    <p class="asi-toc-title">Por mes</p>
    <ol id="toc-list"></ol>
  </nav>

  <a class="back-mobile" href="index.html">← Volver al mapa</a>
  <details class="asi-toc-mobile">
    <summary>Índice por mes</summary>
    <ol id="toc-list-mobile"></ol>
  </details>

  <main class="asi-content">
    <h1>Cambios en el mapa</h1>
    <p class="sub">registro de qué se ha añadido, corregido o verificado en cada sesión</p>
    <div class="page-nav">
      <a href="index.html">← Mapa</a>
      <a href="asi.html">Qué es la ASI</a>
      <a href="noticias.html">Noticias</a>
      <a href="CHANGELOG.md">Ver en Markdown</a>
    </div>
    <div id="changelog"><p class="page-status">Cargando cambios…</p></div>
    <div class="asi-back-footer"><a href="index.html">← Volver al mapa</a></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  // Lee CHANGELOG.md tal cual: la página nunca se queda desfasada respecto al registro.
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const HEAD_RE = /^(\d{4})-(\d{2})-(\d{2})\s*(?:\((.*)\))?\s*$/;

  function fmtDay(y, m, d) { return `${parseInt(d, 10)} de ${MONTHS[parseInt(m, 10) - 1]} de ${y}`; }
  function monthLabel(y, m) { const n = MONTHS[parseInt(m, 10) - 1]; return `${n.charAt(0).toUpperCase()}${n.slice(1)} de ${y}`; }

  fetch('CHANGELOG.md').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(md => {
    // Trocea por encabezados "## " (cada sesión de cambios).
    const parts = md.split(/^## /m);
    const intro = parts.shift().replace(/^# .*$/m, '').trim();
    const months = [];  // {key, label, firstId, count}
    let html = intro ? `<div class="cl-intro">${marked.parse(intro)}</div>` : '';

    parts.forEach((part, i) => {
      const nl = part.indexOf('\n');
      const heading = (nl === -1 ? part : part.slice(0, nl)).trim();
      const body = nl === -1 ? '' : part.slice(nl + 1);
      const m = heading.match(HEAD_RE);
      const id = `c-${i + 1}`;
      let headHtml;
      if (m) {
        const [, y, mo, d, desc] = m;
        const key = `${y}-${mo}`;
        let g = months.find(x => x.key === key);
        if (!g) { g = { key, label: monthLabel(y, mo), firstId: id, count: 0 }; months.push(g); }
        g.count++;
        headHtml = `<span class="cl-date">${esc(fmtDay(y, mo, d))}</span>${desc ? marked.parseInline(desc.charAt(0).toUpperCase() + desc.slice(1)) : ''}`;
      } else {
        headHtml = marked.parseInline(heading);
      }
      html += `<section class="cl-entry" id="${id}"><h2>${headHtml}</h2>${marked.parse(body)}</section>`;
    });

    document.getElementById('changelog').innerHTML = html;
    document.querySelectorAll('#changelog a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

    const toc = months.map(g => `<li><a href="#${g.firstId}">${esc(g.label)}<span class="toc-count">(${g.count})</span></a></li>`).join('');
    document.getElementById('toc-list').innerHTML = toc;
    document.getElementById('toc-list-mobile').innerHTML = toc;

    // Resalta en el índice el mes de la entrada visible.
    const tocLinks = [...document.querySelectorAll('#toc-list li')];
    const monthOf = {};
    document.querySelectorAll('.cl-entry').forEach(s => {
      const g = months.find(x => x.firstId === s.id);
      monthOf[s.id] = g ? g.key : null;
    });
    let current = months[0] && months[0].key;
    document.querySelectorAll('.cl-entry').forEach(s => { if (monthOf[s.id]) current = monthOf[s.id]; else monthOf[s.id] = current; });
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const k = monthOf[e.target.id];
        tocLinks.forEach((li, idx) => li.classList.toggle('active', months[idx].key === k));
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    document.querySelectorAll('.cl-entry').forEach(s => obs.observe(s));

    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  }).catch(err => {
    console.error(err);
    document.getElementById('changelog').innerHTML =
      '<p class="page-status">No se pudo cargar CHANGELOG.md. Si abres el fichero en local, sírvelo con un servidor HTTP.</p>';
  });
})();
</script>
</body>
</html>
